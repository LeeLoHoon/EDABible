<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aeaa43"/>
      <stop offset="1" stop-color="#7e7a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="150" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="256" y1="190" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#ece6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26240f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(0 -22) translate(256 256) scale(1.1) translate(-256 -256)">
  <g filter="url(#shadow)">
    <!-- 책 두께(페이지 더미) -->
    <path d="M256 230
             C212 214 158 212 110 230
             L102 372
             C150 354 212 356 256 374
             C300 356 362 354 410 372
             L402 230
             C354 212 300 214 256 230 Z"
          fill="#d9d2ae"/>

    <!-- 왼쪽 페이지 -->
    <path d="M256 218
             C212 202 158 200 110 218
             L104 356
             C152 338 212 340 256 360 Z"
          fill="url(#page)"/>
    <!-- 오른쪽 페이지 -->
    <path d="M256 218
             C300 202 354 200 402 218
             L408 356
             C360 338 300 340 256 360 Z"
          fill="url(#page)"/>

    <!-- 가운데 골(그림자) -->
    <path d="M256 218 L256 360"
          stroke="#c2bc8f" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 필사 라인 (왼쪽) -->
  <g stroke="#bdb787" stroke-width="7" stroke-linecap="round">
    <line x1="138" y1="250" x2="226" y2="244"/>
    <line x1="134" y1="278" x2="226" y2="272"/>
    <line x1="138" y1="306" x2="210" y2="302"/>
  </g>
  <!-- 필사 라인 (오른쪽) -->
  <g stroke="#bdb787" stroke-width="7" stroke-linecap="round">
    <line x1="286" y1="244" x2="374" y2="250"/>
    <line x1="286" y1="272" x2="378" y2="278"/>
    <line x1="302" y1="302" x2="374" y2="306"/>
  </g>

  <!-- 책갈피 리본 -->
  <path d="M236 206 L260 206 L260 398 L248 380 L236 398 Z"
        fill="#6f6b22"/>
  <path d="M236 206 L242 206 L242 398 L236 398 Z"
        fill="#8d8930"/>
  </g>
</svg>
